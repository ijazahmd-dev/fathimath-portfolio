<!-- Video Modal -->
<div id="video-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;align-items:center;justify-content:center;">
  <div style="position:relative;width:90%;max-width:900px;aspect-ratio:16/9;">
    <iframe id="modal-iframe" src="" frameborder="0" allow="autoplay;encrypted-media" allowfullscreen style="width:100%;height:100%;border:none;"></iframe>
    <button id="modal-close" style="position:absolute;top:-44px;right:0;background:none;border:none;color:#fff;font-size:16px;cursor:pointer;font-family:Courier New,monospace;letter-spacing:0.05em;">✕ CLOSE</button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

  // ─── TABS DROPDOWN (mobile) ───────────────────────────────────
  var tabsWrapper = document.querySelector('.tabs-2');
  if (tabsWrapper) {
    var tabLinks = tabsWrapper.querySelectorAll('.w-tab-link');
    var tabLabels = [];
    tabLinks.forEach(function(link) {
      tabLabels.push(link.textContent.trim());
    });

    var dropdown = document.createElement('div');
    dropdown.className = 'tabs-dropdown';

    var btn = document.createElement('button');
    btn.className = 'tabs-dropdown-btn';
    btn.innerHTML = tabLabels[0] + ' <span class="tabs-dropdown-icon">+</span>';

    var list = document.createElement('div');
    list.className = 'tabs-dropdown-list';

    tabLabels.forEach(function(label, i) {
      var option = document.createElement('div');
      option.className = 'tabs-dropdown-option' + (i === 0 ? ' is-active' : '');
      option.textContent = label;
      option.addEventListener('click', function() {
        btn.innerHTML = label + ' <span class="tabs-dropdown-icon">+</span>';
        list.classList.remove('is-open');
        btn.querySelector('.tabs-dropdown-icon').textContent = '+';
        list.querySelectorAll('.tabs-dropdown-option').forEach(function(opt) {
          opt.classList.remove('is-active');
        });
        option.classList.add('is-active');
        tabLinks[i].click();
      });
      list.appendChild(option);
    });

    btn.addEventListener('click', function() {
      var isOpen = list.classList.toggle('is-open');
      btn.querySelector('.tabs-dropdown-icon').textContent = isOpen ? '−' : '+';
    });

    document.addEventListener('click', function(e) {
      if (!dropdown.contains(e.target)) {
        list.classList.remove('is-open');
        btn.querySelector('.tabs-dropdown-icon').textContent = '+';
      }
    });

    dropdown.appendChild(btn);
    dropdown.appendChild(list);
    tabsWrapper.parentNode.insertBefore(dropdown, tabsWrapper);
  }

  // ─── GAMEBOY PLAYER ───────────────────────────────────────────
  var modal = document.getElementById('video-modal');
  var modalIframe = document.getElementById('modal-iframe');
  var modalClose = document.getElementById('modal-close');

  var playDefault = 'https://cdn.prod.website-files.com/6220244ad6c7a7e70fbf6593/6a4b94251c696d519718c0af_ICONS%3DPLAY%20ICON%2C%20State%3DDefault%20(1).svg';
  var playHover = 'https://cdn.prod.website-files.com/6220244ad6c7a7e70fbf6593/6a4b9425396a09892fb71717_ICONS%3DPLAY%20ICON%2C%20State%3DHover%20(1).svg';

  function convertToEmbed(url) {
    if (!url) return '';
    if (url.includes('watch?v=')) {
      var videoId = url.split('watch?v=')[1].split('&')[0];
      return 'https://www.youtube.com/embed/' + videoId;
    }
    if (url.includes('youtu.be/')) {
      var videoId = url.split('youtu.be/')[1].split('?')[0];
      return 'https://www.youtube.com/embed/' + videoId;
    }
    return url;
  }

  function openModal(url) {
    var embedUrl = convertToEmbed(url) + '?autoplay=1&rel=0';
    modalIframe.src = embedUrl;
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    modal.style.display = 'none';
    modalIframe.src = '';
    document.body.style.overflow = '';
  }

  function updateScreen(screenDiv, items, index, isInspiration) {
    if (!items[index] || !screenDiv) return;
    var thumbImg = items[index].querySelector('.media-item-thumb');
    var thumbSrc = thumbImg ? thumbImg.src : '';
    var videoUrl = items[index].getAttribute('data-video') || '';

    if (isInspiration) {
      screenDiv.innerHTML =
        '<div class="gameboy-poster" style="width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;background:#FAF9F6;">' +
          '<img src="' + thumbSrc + '" style="height:100%;width:auto;object-fit:contain;display:block;">' +
        '</div>';
    } else {
      screenDiv.innerHTML =
        '<div class="gameboy-poster" style="width:100%;height:100%;position:relative;cursor:pointer;">' +
          '<img src="' + thumbSrc + '" style="width:100%;height:100%;object-fit:cover;display:block;">' +
          '<img class="gameboy-play-icon" src="' + playDefault + '" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;pointer-events:none;transition:opacity 0.2s;">' +
        '</div>';

      var poster = screenDiv.querySelector('.gameboy-poster');
      var playIcon = screenDiv.querySelector('.gameboy-play-icon');

      poster.addEventListener('mouseenter', function() {
        playIcon.src = playHover;
      });
      poster.addEventListener('mouseleave', function() {
        playIcon.src = playDefault;
      });
      poster.addEventListener('click', function(e) {
        e.stopPropagation();
        if (videoUrl) openModal(videoUrl);
      });
    }
  }

  function initGameboy(pane, skipInitialScroll) {
    var items = pane.querySelectorAll('.media-item');
    var screenDiv = pane.querySelector('.gameboy-screen');
    var btnA = pane.querySelector('.gameboy-btn-a');
    var btnB = pane.querySelector('.gameboy-btn-b');
    var btnStart = pane.querySelector('.gameboy-btn-start');
    var current = 0;

    var isInspiration = pane.querySelector('.media-item.insp') !== null;

    if (!items.length || !screenDiv) return;

    function setActive(index) {
      items.forEach(function(item) {
        item.classList.remove('media-item-active');
      });
      if (items[index]) items[index].classList.add('media-item-active');
    }

    function activate(index, skipScroll) {
      current = index;
      setActive(index);
      updateScreen(screenDiv, items, index, isInspiration);
      if (!skipScroll && items[index] && window.innerWidth > 767) {
        items[index].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    items.forEach(function(item, i) {
      item.addEventListener('click', function(e) {
        if (e.target.closest('.gameboy-screen')) return;
        activate(i, false);
      });
    });

    if (btnA) {
      btnA.addEventListener('click', function(e) {
        e.stopPropagation();
        activate((current + 1) % items.length, false);
      });
    }

    if (btnB) {
      btnB.addEventListener('click', function(e) {
        e.stopPropagation();
        activate((current - 1 + items.length) % items.length, false);
      });
    }

    if (btnStart) {
      btnStart.addEventListener('click', function(e) {
        e.stopPropagation();
        if (isInspiration) return;
        var videoUrl = items[current] ? items[current].getAttribute('data-video') : '';
        if (videoUrl) openModal(videoUrl);
      });
    }

    // Always skip scroll on initial load
    activate(0, true);
  }

  // Init all tab panes with a gameboy-screen
  var panes = document.querySelectorAll('.w-tab-pane');
  panes.forEach(function(pane) {
    if (pane.querySelector('.gameboy-screen')) {
      initGameboy(pane, true);
    }
  });

  // Re-init on tab change — always skip scroll
  document.addEventListener('click', function(e) {
    var tabLink = e.target.closest('.w-tab-link');
    if (!tabLink) return;
    setTimeout(function() {
      var activePanes = document.querySelectorAll('.w-tab-pane.w--tab-active');
      activePanes.forEach(function(pane) {
        if (pane.querySelector('.gameboy-screen')) {
          initGameboy(pane, true);
        }
      });
    }, 100);
  });

  // Modal controls
  if (modal) {
    if (modalClose) modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', function(e) {
      if (e.target === modal) closeModal();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });
  }

});
</script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var navBtn = document.querySelector('.navbar-button');
  if (!navBtn) return;

  var closeIconUrl = 'https://cdn.prod.website-files.com/6220244ad6c7a7e70fbf6593/6a4b9a052b662dcbfd992b4a_ICONS%3DExit%2C%20State%3DPressed%20(1).svg';

  function updateIcon() {
    var isOpen = navBtn.classList.contains('w--open');
    var iconEl = navBtn.querySelector('.w-icon-nav-menu');

    if (isOpen) {
      if (iconEl) {
        iconEl.style.display = 'none';
      }
      if (!navBtn.querySelector('.nav-close-icon')) {
        var img = document.createElement('img');
        img.src = closeIconUrl;
        img.className = 'nav-close-icon';
        img.style.width = '24px';
        img.style.height = '24px';
        img.style.display = 'block';
        navBtn.appendChild(img);
      }
    } else {
      if (iconEl) {
        iconEl.style.display = 'block';
      }
      var closeImg = navBtn.querySelector('.nav-close-icon');
      if (closeImg) closeImg.remove();
    }
  }

  navBtn.addEventListener('click', function() {
    // Wait a tick for Webflow to toggle the w--open class first
    setTimeout(updateIcon, 10);
  });
});
</script></body></html>
